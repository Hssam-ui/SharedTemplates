parameters:
  - name: dotNetVersion
    type: string
    default: '9.x'
  - name: buildConfiguration
    type: string
    default: 'Release'
  - name: projectPath
    type: string
    default: ''
  - name: runTests
    type: boolean
    default: true
  - name: poolName
    type: string
    default: 'Default'


stages:
  - stage: BuildAndPublish
    displayName: 'Build and Publish'
    jobs:
      - job: Build
        pool:
          name: ${{ parameters.poolName }}
        steps:
          - task: UseDotNet@2
            displayName: 'install .NET SDK ${{ parameters.dotNetVersion }}'
            inputs:
              packageType: 'sdk'
              version: ${{ parameters.dotNetVersion }}
          - script: 
                dotnet restore ${{ parameters.projectPath }}
            displayName: 'Restore dependencies'
          - script: 
                dotnet build ${{ parameters.projectPath }} --configuration ${{ parameters.buildConfiguration }} --no-restore
            displayName: 'Build project'

          - ${{if eq(parameters.runTests, true)}}:
            - script:
                dotnet test **/*Tests*.csproj --configuration ${{ parameters.buildConfiguration }} --no-build --logger trx
              displayName: 'Run tests'
            - task: publishTestResults@2
              displayName: 'Publish Test Results'
              inputs:
                testResultsFormat: 'VSTest'
                testResultsFiles: '**/*.trx'


          - script: 
                dotnet publish ${{ parameters.projectPath }} --configuration ${{ parameters.buildConfiguration }} --no-build --output $(Build.ArtifactStagingDirectory)/app
            displayName: 'Publish project'
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: "production-deployment-package"
              publishLocation: "Container"     
           


            

